<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b3f">
<title>WASLA | مساحة أعمالك</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#102b3f;--navy2:#173c52;--teal:#13a889;--mint:#dff6ef;--ink:#172d3b;--muted:#71818c;--line:#e6edf0;--bg:#f4f7f8;--white:#fff;--shadow:0 12px 35px #1834470b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.shell{min-height:100vh}
.top{height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;box-shadow:0 5px 22px #102b3f20}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:23px;letter-spacing:1px}
.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#53e0bd,#0c9b83);display:grid;place-items:center;color:#103448;font-size:19px}
.brand small{display:block;font-size:9px;letter-spacing:2px;color:#b8d1d9;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:10px}
.top button{color:#fff;background:#ffffff16;border:1px solid #ffffff25;padding:9px 13px;border-radius:10px}
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 72px)}
aside{background:#fff;border-inline-end:1px solid var(--line);padding:25px 16px}
.userbox{padding:14px;border-radius:15px;background:#f5f9fa;margin-bottom:25px}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--mint);color:#087d68;display:grid;place-items:center;font-weight:800;font-size:17px}
.userrow{display:flex;align-items:center;gap:11px}
.userbox strong{display:block;font-size:14px}
.userbox small{color:var(--muted);font-size:11px}
.navlabel{font-size:10px;color:#9aa8af;font-weight:800;padding:8px 12px 10px}
.navbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:11px;background:transparent;color:#536673;text-align:start;margin:3px 0;font-weight:650}
.navbtn .ico{width:23px;text-align:center;font-size:17px}
.navbtn.active{background:#e8f7f3;color:#087e69}
.navbtn:hover{background:#f3f8f8}
.navfoot{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
.main{padding:30px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
.eyebrow{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:1px}
.pagehead h1{font-size:27px;margin:6px 0}
.sub{color:var(--muted);font-size:13px;line-height:1.8;margin:0}
.btn{padding:11px 16px;border-radius:11px;background:var(--teal);color:#fff;font-weight:750}
.btn.secondary{background:#edf3f5;color:#294454}
.btn.ghost{background:#fff;color:#37515f;border:1px solid var(--line)}
.btn.danger{background:#fff0ef;color:#b54742}
.btn:disabled{opacity:.55;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow);min-width:0}
.stat{display:flex;align-items:center;justify-content:space-between}
.stat .number{font-size:28px;font-weight:850;margin-top:12px}
.stat .symbol{width:42px;height:42px;border-radius:13px;background:#eaf7f3;color:#0b987c;display:grid;place-items:center;font-size:20px}
.sectiontitle{font-size:17px;margin:0 0 15px}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.stack{display:grid;gap:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field{width:100%;padding:12px 13px;border:1px solid #dfe8eb;border-radius:10px;background:#fff;color:var(--ink);outline:none}
.field:focus{border-color:#38b99e;box-shadow:0 0 0 3px #13a88918}
textarea.field{min-height:105px;resize:vertical}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid label{display:grid;gap:6px;font-size:12px;color:#526672}
.full{grid-column:1/-1}
.notice{padding:12px 14px;border-radius:11px;background:#eef7f5;color:#176c5b;font-size:13px;margin-bottom:16px}
.notice.error{background:#fff0ef;color:#a33d38}
.hidden{display:none!important}
.list{display:grid;gap:10px}
.entry{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff}
.entry h3{font-size:14px;margin:0 0 6px}
.entry p{font-size:12px;color:var(--muted);line-height:1.8;margin:5px 0}
.tag{display:inline-flex;padding:5px 9px;border-radius:30px;background:#edf7f4;color:#14836e;font-size:11px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.toolbar .field{max-width:360px}
.inbox{display:grid;grid-template-columns:minmax(270px,350px) minmax(0,1fr);min-height:590px;overflow:hidden;padding:0}
.conversations{border-inline-end:1px solid var(--line);background:#fbfdfd}
.inboxhead{padding:19px;border-bottom:1px solid var(--line)}
.inboxhead h2{margin:0 0 12px;font-size:18px}
.conversation{width:100%;border:0;background:transparent;text-align:start;display:flex;gap:11px;padding:14px 16px;border-bottom:1px solid #edf1f2;color:var(--ink)}
.conversation:hover,.conversation.selected{background:#eaf7f3}
.convavatar{flex:0 0 40px;height:40px;border-radius:13px;background:#e5eef2;color:#31596b;display:grid;place-items:center;font-weight:800}
.convbody{min-width:0;flex:1}
.convtop{display:flex;justify-content:space-between;gap:8px}
.convtop strong{font-size:12px}
.convtop time{font-size:10px;color:#87969e;white-space:nowrap}
.preview{font-size:11px;color:#77868e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.thread{display:flex;flex-direction:column;min-width:0;background:#fff}
.threadhead{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.threadhead strong{font-size:14px}
.threadbody{padding:22px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:350px;max-height:490px;overflow:auto;background:linear-gradient(#fff,#fbfdfd)}
.bubble{max-width:min(78%,560px);padding:11px 14px;border-radius:15px;background:#f0f4f6;align-self:flex-start}
.bubble.mine{background:#dff6ef;align-self:flex-end}
.bubble p{margin:0;font-size:13px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble time{display:block;text-align:end;color:#819098;font-size:10px;margin-top:5px}
.composer{border-top:1px solid var(--line);padding:15px;display:flex;gap:9px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:120px}
.empty{height:100%;min-height:300px;display:grid;place-items:center;text-align:center;color:#87969e;padding:25px}
.empty b{display:block;color:#385261;margin-bottom:7px}
.skeleton{height:14px;background:linear-gradient(90deg,#edf2f3,#f8fafa,#edf2f3);background-size:200% 100%;animation:shine 1.2s infinite;border-radius:8px}
@keyframes shine{to{background-position:-200% 0}}
.content{animation:fade .16s ease}
@keyframes fade{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}
.mobilemenu{display:none}
.footerhint{font-size:11px;color:#9aa7ad;line-height:1.7;margin-top:25px}
@media(max-width:900px){
.layout{grid-template-columns:1fr}
aside{position:fixed;z-index:30;inset-block:72px;inset-inline-start:0;width:260px;transform:translateX(110%);transition:transform .2s;box-shadow:0 15px 35px #102b3f20}
.layout.menu-open aside{transform:translateX(0)}
.mobilemenu{display:inline-block}
.main{padding:22px 16px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:620px){
.top{padding:0 14px;height:64px}
.layout{min-height:calc(100vh - 64px)}
aside{inset-block-start:64px}
.main{padding:18px 12px}
.grid{grid-template-columns:1fr}
.pagehead{align-items:flex-start}
.pagehead h1{font-size:22px}
.inbox{grid-template-columns:1fr;min-height:0}
.conversations{border-inline-end:0}
.thread{min-height:520px}
.conversation{padding:12px}
.formgrid{grid-template-columns:1fr}
.full{grid-column:auto}
.top-actions button{padding:8px 9px;font-size:11px}
}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<div class="brand"><span class="brandmark">W</span><span>WASLA<small>GLOBAL BUSINESS NETWORK</small></span></div>
<div class="top-actions">
<button class="mobilemenu" id="menuBtn">☰</button>
<button id="langBtn">English</button>
<button id="logoutBtn">تسجيل الخروج</button>
</div>
</header>
<div class="layout" id="layout">
<aside>
<div class="userbox">
<div class="userrow">
<div class="avatar" id="avatar">W</div>
<div><strong id="userName">جارٍ التحميل…</strong><small id="userType">WASLA member</small></div>
</div>
</div>
<div class="navlabel" data-ar="مساحة العمل" data-en="WORKSPACE">مساحة العمل</div>
<nav id="nav">
<button class="navbtn active" data-page="overview"><span class="ico">◫</span><span data-ar="نظرة عامة" data-en="Overview">نظرة عامة</span></button>
<button class="navbtn" data-page="discover"><span class="ico">⌕</span><span data-ar="استكشاف السوق" data-en="Discover">استكشاف السوق</span></button>
<button class="navbtn business-only" data-page="products"><span class="ico">▦</span><span data-ar="منتجاتي" data-en="My products">منتجاتي</span></button>
<button class="navbtn" data-page="inbox"><span class="ico">✉</span><span data-ar="صندوق الوارد" data-en="Inbox">صندوق الوارد</span></button>
<button class="navbtn" data-page="company"><span class="ico">▤</span><span data-ar="ملف النشاط" data-en="Business profile">ملف النشاط</span></button>
</nav>
<div class="navfoot">
<button class="navbtn" data-page="settings"><span class="ico">⚙</span><span data-ar="الإعدادات" data-en="Settings">الإعدادات</span></button>
</div>
<p class="footerhint">WASLA · Business, Connected.<br>نسخة تشغيلية مرتبطة بقاعدة بياناتك الحالية.</p>
</aside>
<main class="main">
<div id="notice" class="notice hidden" role="status"></div>
<div id="page" class="content">
<div class="card"><div class="skeleton" style="width:35%"></div><br><div class="skeleton" style="width:75%"></div></div>
</div>
</main>
</div>
</div>

<script>
const SUPABASE_URL='https://bzrcbodvcuujdjupfgzw.supabase.co';
const SUPABASE_KEY='sb_publishable_EAWH4688yaEOk537GOBWIg_Hz4DPN3u';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null,profile=null,company=null;
let products=[],inquiries=[];
let page='overview',activeInquiry=null,lang='ar';

const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=(ar,en)=>lang==='ar'?ar:en;

function showNotice(message,error=false){
  const box=$('notice');
  box.textContent=message;
  box.classList.remove('hidden','error');
  if(error)box.classList.add('error');
  window.clearTimeout(showNotice.timer);
  showNotice.timer=window.setTimeout(()=>box.classList.add('hidden'),5000);
}

function typeName(type){
  const names={
    company:['شركة','Company'],
    manufacturer:['مصنّع','Manufacturer'],
    brand:['علامة تجارية','Brand'],
    trader:['تاجر','Trader'],
    buyer:['مشتري','Buyer']
  };
  const value=names[type];
  return value?t(value[0],value[1]):(type||'Member');
}

/* إصلاح الدوال الناقصة */
function rel(value){
  if(Array.isArray(value)) return value[0] || null;
  return value || null;
}

function status(value){
  const names={
    published:['منشور','Published'],
    draft:['مسودة','Draft'],
    pending:['قيد الانتظار','Pending'],
    active:['نشط','Active'],
    inactive:['غير نشط','Inactive'],
    archived:['مؤرشف','Archived']
  };
  return names[value]?t(names[value][0],names[value][1]):(value||'');
}

function formatDate(value){
  if(!value)return '';
  return new Intl.DateTimeFormat(lang==='ar'?'ar':'en',{
    dateStyle:'medium',timeStyle:'short'
  }).format(new Date(value));
}

function head(title,subtitle,action=''){
  return `<div class="pagehead">
    <div><div class="eyebrow">WASLA WORKSPACE</div>
    <h1>${title}</h1><p class="sub">${subtitle}</p></div>
    ${action}
  </div>`;
}

function setActiveNav(){
  document.querySelectorAll('.navbtn[data-page]').forEach(button=>{
    button.classList.toggle('active',button.dataset.page===page);
  });
  $('layout').classList.remove('menu-open');
}

function navEvents(){
  document.querySelectorAll('[data-page]').forEach(button=>{
    button.addEventListener('click',()=>navigate(button.dataset.page));
  });

  $('menuBtn').addEventListener('click',()=>{
    $('layout').classList.toggle('menu-open');
  });

  $('langBtn').addEventListener('click',toggleLang);

  $('logoutBtn').addEventListener('click',async()=>{
    const {error}=await db.auth.signOut();
    if(error)showNotice(error.message,true);
    else location.reload();
  });
}

async function boot(){
  try{
    const {data:{session},error}=await db.auth.getSession();
    if(error)throw error;

    if(!session){
      $('page').innerHTML=`<div class="card">
        <h2>${t('يلزم تسجيل الدخول','Sign in required')}</h2>
        <p class="muted">${t('سجّل الدخول من صفحة WASLA الرئيسية أولاً.','Please sign in from the main WASLA page first.')}</p>
      </div>`;
      return;
    }

    user=session.user;

    const {data:profileData,error:profileError}=await db
      .from('profiles')
      .select('*')
      .eq('id',user.id)
      .single();

    if(profileError)throw profileError;
    profile=profileData;

    $('userName').textContent=profile.full_name||user.email;
    $('userType').textContent=typeName(profile.account_type);
    $('avatar').textContent=(profile.full_name||'W').trim().charAt(0).toUpperCase();

    document.querySelectorAll('.business-only').forEach(el=>{
      el.classList.toggle('hidden',profile.account_type==='buyer');
    });

    await loadCompany();
    await loadProducts();
    await loadInquiries();
    navigate('overview');

  }catch(error){
    console.error('WASLA boot error:',error);
    showNotice(t('تعذّر تحميل الحساب: ','Could not load account: ')+error.message,true);
  }
}

async function loadCompany(){
  const {data,error}=await db
    .from('companies')
    .select('*')
    .eq('owner_id',user.id)
    .maybeSingle();

  if(error)throw error;
  company=data;
}

async function loadProducts(){
  if(!company){
    products=[];
    return;
  }

  const {data,error}=await db
    .from('products')
    .select('*')
    .eq('company_id',company.id)
    .order('created_at',{ascending:false});

  if(error)throw error;
  products=data||[];
}

async function loadInquiries(){
  let query=db.from('inquiries')
    .select('*,products(name),companies(name)')
    .order('created_at',{ascending:false});

  if(profile.account_type==='buyer'){
    query=query.eq('buyer_id',user.id);
  }else if(company){
    query=query.eq('company_id',company.id);
  }else{
    inquiries=[];
    return;
  }

  const {data,error}=await query;
  if(error)throw error;
  inquiries=data||[];
}

function navigate(next){
  page=next;
  setActiveNav();

  const pages={
    overview:renderOverview,
    discover:renderDiscover,
    products:renderProducts,
    inbox:renderInbox,
    company:renderCompany,
    settings:renderSettings
  };

  (pages[page]||renderOverview)();
}

function renderOverview(){
  const buyer=profile.account_type==='buyer';
  const stats=buyer?[
    [t('استفساراتي','My inquiries'),inquiries.length,'✉'],
    [t('استفسارات بانتظار الرد','Awaiting reply'),inquiries.filter(x=>!x.reply).length,'◷'],
    [t('استفسارات تم الرد عليها','Answered inquiries'),inquiries.filter(x=>!!x.reply).length,'✓']
  ]:[
    [t('منتجاتي','My products'),products.length,'▦'],
    [t('الاستفسارات الواردة','Incoming inquiries'),inquiries.length,'✉'],
    [t('بانتظار الرد','Awaiting reply'),inquiries.filter(x=>!x.reply).length,'◷']
  ];

  $('page').innerHTML=head(
    t('مرحباً بك في WASLA','Welcome to WASLA'),
    t('مساحة واحدة لإدارة حضورك التجاري والتواصل مع الشركات والعملاء.','One workspace to manage your business presence and connect with buyers and companies.')
  )+`
  <div class="grid">
    ${stats.map(([label,value,icon])=>`
      <div class="card">
        <div class="stat"><span class="muted">${label}</span><span class="symbol">${icon}</span></div>
        <div class="number">${value}</div>
      </div>`).join('')}
  </div>
  <div class="card" style="margin-top:18px">
    <div class="row">
      <h2 class="sectiontitle">${t('آخر النشاطات','Recent activity')}</h2>
      <button class="btn secondary" onclick="navigate('inbox')">${t('فتح الوارد','Open inbox')}</button>
    </div>
    ${inquiries.length?`
      <div class="list">
      ${inquiries.slice(0,5).map(item=>`
        <div class="entry">
          <div class="row">
            <h3>${esc(rel(item.products)?.name||t('استفسار تجاري','Business inquiry'))}</h3>
            <span class="tag">${item.reply?t('تم الرد','Replied'):t('بانتظار الرد','Awaiting reply')}</span>
          </div>
          <p>${esc(item.message||'')}</p>
          <p>${formatDate(item.created_at)}</p>
        </div>`).join('')}
      </div>`:
      `<div class="empty"><div><b>${t('لا يوجد نشاط بعد','No activity yet')}</b>${t('ستظهر هنا آخر استفساراتك ونشاطات حسابك.','Your latest inquiries and account activity will appear here.')}</div></div>`}
  </div>`;
}

async function renderDiscover(){
  $('page').innerHTML=head(
    t('استكشاف السوق','Discover the market'),
    t('اكتشف المنتجات والأنشطة التجارية المنشورة على WASLA.','Explore products and businesses published on WASLA.')
  )+`
  <div class="toolbar">
    <input class="field" id="searchProducts" placeholder="${t('ابحث عن منتج أو شركة...','Search products or companies...')}">
    <button class="btn" id="searchBtn">${t('بحث','Search')}</button>
  </div>
  <div id="discoverResults" class="grid"><div class="card">${t('جارٍ تحميل السوق...','Loading marketplace...')}</div></div>`;

  $('searchBtn').onclick=()=>fetchDiscover($('searchProducts').value);
  $('searchProducts').onkeydown=e=>{if(e.key==='Enter')fetchDiscover(e.target.value)};
  await fetchDiscover('');
}

async function fetchDiscover(term){
  const target=$('discoverResults');
  if(!target)return;

  target.innerHTML=`<div class="card">${t('جارٍ البحث...','Searching...')}</div>`;

  try{
    const {data,error}=await db.from('products')
      .select('*,companies(name,country,city)')
      .eq('status','published')
      .order('created_at',{ascending:false});

    if(error)throw error;

    const filtered=(data||[]).filter(item=>{
      const companyData=rel(item.companies)||{};
      const text=[item.name,item.description,item.category,companyData.name,companyData.country,companyData.city].join(' ').toLowerCase();
      return text.includes((term||'').toLowerCase());
    });

    target.innerHTML=filtered.length?filtered.map(item=>{
      const companyData=rel(item.companies)||{};
      return `<div class="card">
        ${item.image_url?`<img src="${esc(item.image_url)}" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:13px">`:''}
        <div class="row"><span class="tag">${esc(item.category||t('منتج','Product'))}</span></div>
        <h3>${esc(item.name)}</h3>
        <p class="muted">${esc(item.description||'')}</p>
        <p class="muted">${esc(companyData.name||'')} · ${esc(companyData.city||'')} ${esc(companyData.country||'')}</p>
        <button class="btn" onclick="startInquiry('${item.id}')">${t('إرسال استفسار','Send inquiry')}</button>
      </div>`;
    }).join(''):`<div class="card">${t('لا توجد نتائج مطابقة حالياً.','No matching results found.')}</div>`;

  }catch(error){
    target.innerHTML=`<div class="card notice error">${esc(error.message)}</div>`;
  }
}

async function startInquiry(productId){
  if(profile.account_type==='buyer'){
    const message=prompt(t('اكتب استفسارك عن المنتج:','Write your inquiry about this product:'));
    if(!message||!message.trim())return;

    try{
      const {data:product,error:productError}=await db.from('products')
        .select('company_id')
        .eq('id',productId)
        .single();

      if(productError)throw productError;

      const {error}=await db.from('inquiries').insert({
        product_id:productId,
        company_id:product.company_id,
        buyer_id:user.id,
        message:message.trim(),
        status:'pending'
      });

      if(error)throw error;
      await loadInquiries();
      showNotice(t('تم إرسال الاستفسار.','Inquiry sent.'));
    }catch(error){
      showNotice(error.message,true);
    }
  }else{
    showNotice(t('إرسال الاستفسارات متاح لحسابات المشترين.','Sending inquiries is available to buyer accounts.'),true);
  }
}

function renderProducts(){
  if(profile.account_type==='buyer'){
    $('page').innerHTML=head(t('منتجاتي','My products'),t('هذه الصفحة مخصصة للحسابات التجارية.','This page is for business accounts.'))+
      `<div class="card">${t('حساب المشتري لا يملك قائمة منتجات.','Buyer accounts do not have product listings.')}</div>`;
    return;
  }

  $('page').innerHTML=head(
    t('منتجاتي','My products'),
    t('أدر المنتجات التي تعرضها في سوق WASLA.','Manage the products you list on the WASLA marketplace.'),
    `<button class="btn" id="addProductBtn">${t('＋ إضافة منتج','＋ Add product')}</button>`
  )+`
  <div id="productFormWrap" class="card hidden" style="margin-bottom:18px">
    <h2 class="sectiontitle">${t('إضافة منتج جديد','Add a new product')}</h2>
    <form id="productForm" class="formgrid">
      <label>${t('اسم المنتج','Product name')}<input class="field" name="name" required></label>
      <label>${t('التصنيف','Category')}<input class="field" name="category"></label>
      <label class="full">${t('رابط صورة المنتج','Product image URL')}<input class="field" name="image_url" type="url"></label>
      <label class="full">${t('وصف المنتج','Product description')}<textarea class="field" name="description"></textarea></label>
      <div class="full row">
        <button class="btn">${t('حفظ المنتج','Save product')}</button>
        <button type="button" class="btn secondary" id="cancelProduct">${t('إلغاء','Cancel')}</button>
      </div>
    </form>
  </div>
  <div class="grid">
    ${products.length?products.map(item=>`
      <div class="card">
        ${item.image_url?`<img src="${esc(item.image_url)}" alt="" style="width:100%;height:145px;object-fit:cover;border-radius:12px;margin-bottom:12px">`:''}
        <span class="tag">${esc(status(item.status))}</span>
        <h3>${esc(item.name)}</h3>
        <p class="muted">${esc(item.description||'')}</p>
        <p class="muted">${esc(item.category||'')}</p>
      </div>`).join(''):`<div class="card">${t('لم تضف منتجات بعد.','You have not added products yet.')}</div>`}
  </div>`;

  $('addProductBtn').onclick=()=>$('productFormWrap').classList.toggle('hidden');
  $('cancelProduct').onclick=()=>$('productFormWrap').classList.add('hidden');

  $('productForm').onsubmit=async event=>{
    event.preventDefault();

    if(!company){
      showNotice(t('أنشئ ملف نشاطك التجاري أولاً.','Create your business profile first.'),true);
      return;
    }

    const form=new FormData(event.target);
    const values=Object.fromEntries(form.entries());

    try{
      const {error}=await db.from('products').insert({
        company_id:company.id,
        name:values.name.trim(),
        category:values.category.trim(),
        image_url:values.image_url.trim()||null,
        description:values.description.trim()
      });

      if(error)throw error;

      await loadProducts();
      renderProducts();
      showNotice(t('تمت إضافة المنتج.','Product added.'));
    }catch(error){
      showNotice(error.message,true);
    }
  };
}

function renderCompany(){
  if(profile.account_type==='buyer'){
    $('page').innerHTML=head(t('ملف الحساب','Account profile'),t('بيانات حسابك في WASLA.','Your WASLA account details.'))+
    `<div class="card">
      <h2 class="sectiontitle">${esc(profile.full_name||'')}</h2>
      <p class="muted">${esc(user.email||'')}</p>
      <span class="tag">${typeName(profile.account_type)}</span>
    </div>`;
    return;
  }

  $('page').innerHTML=head(
    t('ملف النشاط التجاري','Business profile'),
    t('عرّف الآخرين بنشاطك التجاري ومعلومات التواصل.','Introduce your business and contact information.')
  )+`
  <div class="card">
    ${company?`<div class="notice">${t('بيانات نشاطك الحالية. يمكنك تعديلها وحفظ التغييرات.','Your current business information. Edit and save your changes.')}</div>`:''}
    ${companyForm(company||{})}
  </div>`;

  $('companyForm').onsubmit=async event=>{
    event.preventDefault();
    const form=new FormData(event.target);
    const values=Object.fromEntries(form.entries());

    const payload={
      owner_id:user.id,
      name:values.name.trim(),
      country:values.country.trim(),
      city:values.city.trim(),
      sector:values.sector.trim(),
      business_type:values.business_type.trim(),
      email:values.email.trim(),
      phone:values.phone.trim(),
      website:values.website.trim(),
      description:values.description.trim()
    };

    try{
      let result;

      if(company){
        result=await db.from('companies').update(payload).eq('id',company.id);
      }else{
        result=await db.from('companies').insert(payload);
      }

      if(result.error)throw result.error;

      await loadCompany();
      await loadProducts();
      renderCompany();
      showNotice(t('تم حفظ ملف النشاط.','Business profile saved.'));
    }catch(error){
      showNotice(error.message,true);
    }
  };
}

function companyForm(c={}){
  const fields=[
    ['name',t('اسم النشاط التجاري','Business name')],
    ['country',t('الدولة','Country')],
    ['city',t('المدينة','City')],
    ['sector',t('القطاع','Sector')],
    ['business_type',t('نوع النشاط','Business type')],
    ['email',t('البريد الإلكتروني','Email')],
    ['phone',t('الهاتف','Phone')],
    ['website',t('الموقع الإلكتروني','Website')]
  ];

  return `<form id="companyForm" class="formgrid">
    ${fields.map(([key,label])=>`
      <label>${label}
        <input class="field" name="${key}" value="${esc(c[key]||'')}" ${['name','country'].includes(key)?'required':''}>
      </label>`).join('')}
    <label class="full">${t('نبذة عن النشاط','Business description')}
      <textarea class="field" name="description">${esc(c.description||'')}</textarea>
    </label>
    <div class="full"><button class="btn">${t('حفظ التغييرات','Save changes')}</button></div>
  </form>`;
}

function renderInbox(){
  const isBuyer=profile.account_type==='buyer';

  if(!isBuyer&&!company){
    $('page').innerHTML=head(t('صندوق الوارد','Inbox'),t('أنشئ ملف نشاطك أولاً لاستقبال الاستفسارات.','Create your business profile to receive inquiries.'))+
      `<div class="card">${t('لا يوجد ملف نشاط مرتبط بحسابك.','No business profile is linked to your account.')}</div>`;
    return;
  }

  if(!activeInquiry||!inquiries.some(item=>item.id===activeInquiry)){
    activeInquiry=inquiries[0]?.id||null;
  }

  $('page').innerHTML=head(
    t('صندوق الوارد','Inbox'),
    t('تابع الاستفسارات التجارية والردود من مكان واحد.','Manage business inquiries and replies in one place.')
  )+`
  <div class="card inbox">
    <section class="conversations">
      <div class="inboxhead">
        <h2>${t('الاستفسارات','Inquiries')} (${inquiries.length})</h2>
        <input class="field" id="inboxSearch" placeholder="${t('بحث في الاستفسارات...','Search inquiries...')}">
      </div>
      <div id="conversationList">
        ${inquiries.length?inquiries.map(item=>{
          const product=rel(item.products)||{};
          const other=isBuyer?(rel(item.companies)?.name||t('الشركة','Company')):(t('المشتري','Buyer')+' · '+String(item.buyer_id||'').slice(0,8));
          return `<button class="conversation ${activeInquiry===item.id?'selected':''}" data-inquiry="${item.id}">
            <span class="convavatar">${esc(other.charAt(0))}</span>
            <span class="convbody">
              <span class="convtop"><strong>${esc(other)}</strong><time>${formatDate(item.created_at)}</time></span>
              <span class="preview">${esc(product.name||'')} · ${esc(item.message||'')}</span>
              <span class="preview">${item.reply?t('تم الرد','Replied'):t('بانتظار الرد','Awaiting reply')}</span>
            </span>
          </button>`;
        }).join(''):`<div class="empty"><div><b>${t('صندوقك فارغ','Your inbox is empty')}</b>${t('ستظهر الاستفسارات هنا عندما تصلك أو ترسلها.','Inquiries will appear here when sent or received.')}</div></div>`}
      </div>
    </section>
    <section class="thread" id="thread">
      ${renderThreadContent()}
    </section>
  </div>`;

  document.querySelectorAll('[data-inquiry]').forEach(button=>{
    button.onclick=()=>{
      activeInquiry=button.dataset.inquiry;
      renderInbox();
    };
  });

  $('inboxSearch').oninput=event=>{
    const value=event.target.value.toLowerCase();
    document.querySelectorAll('[data-inquiry]').forEach(button=>{
      button.classList.toggle('hidden',!button.textContent.toLowerCase().includes(value));
    });
  };

  const replyForm=$('replyForm');

  if(replyForm){
    replyForm.onsubmit=async event=>{
      event.preventDefault();

      const input=$('replyText');
      const message=input.value.trim();
      if(!message)return;

      const item=inquiries.find(x=>x.id===activeInquiry);
      if(!item)return;

      if(isBuyer){
        showNotice(t('الردود المباشرة من المشتري غير متاحة في هذا الإصدار.','Buyer follow-up messages are not available in this version.'),true);
        return;
      }

      try{
        const {error}=await db.from('inquiries').update({
          reply:message,
          responded_at:new Date().toISOString(),
          status:'responded'
        }).eq('id',item.id);

        if(error)throw error;

        await loadInquiries();
        renderInbox();
        showNotice(t('تم إرسال ردك.','Your reply has been sent.'));
      }catch(error){
        showNotice(error.message,true);
      }
    };
  }
}

function renderThreadContent(){
  const item=inquiries.find(x=>x.id===activeInquiry);

  if(!item){
    return `<div class="empty"><div><b>${t('اختر استفساراً','Select an inquiry')}</b>${t('اختر محادثة من القائمة لعرض تفاصيلها.','Choose an inquiry from the list to view its details.')}</div></div>`;
  }

  const isBuyer=profile.account_type==='buyer';
  const product=rel(item.products)||{};
  const companyData=rel(item.companies)||{};
  const other=isBuyer?(companyData.name||t('الشركة','Company')):t('المشتري','Buyer');

  return `
    <div class="threadhead">
      <div class="convavatar">${esc(other.charAt(0))}</div>
      <div><strong>${esc(other)}</strong><div class="muted">${esc(product.name||t('استفسار تجاري','Business inquiry'))}</div></div>
    </div>
    <div class="threadbody">
      <div class="bubble ${isBuyer?'mine':''}">
        <p>${esc(item.message||'')}</p>
        <time>${formatDate(item.created_at)}</time>
      </div>
      ${item.reply?`
        <div class="bubble ${isBuyer?'':'mine'}">
          <p>${esc(item.reply)}</p>
          <time>${formatDate(item.responded_at)}</time>
        </div>`:''}
      ${!item.reply&&!isBuyer?`<div class="muted">${t('لم يتم الرد على هذا الاستفسار بعد.','This inquiry has not been answered yet.')}</div>`:''}
    </div>
    ${!isBuyer?`
      <form class="composer" id="replyForm">
        <textarea class="field" id="replyText" placeholder="${t('اكتب ردك هنا...','Write your reply...')}" required></textarea>
        <button class="btn">${t('إرسال الرد','Send reply')}</button>
      </form>`:`
      <div class="composer"><p class="muted">${t('يمكنك الاطلاع على رد الشركة هنا.','You can view the company reply here.')}</p></div>`}`;
}

function renderSettings(){
  $('page').innerHTML=head(
    t('الإعدادات','Settings'),
    t('تفضيلات مساحة العمل.','Workspace preferences.')
  )+`
  <div class="card">
    <h2 class="sectiontitle">${t('اللغة','Language')}</h2>
    <p class="muted">${t('يمكنك التبديل بين العربية والإنجليزية من الشريط العلوي.','Switch between Arabic and English from the top bar.')}</p>
    <button class="btn secondary" onclick="toggleLang()">${t('تغيير اللغة','Change language')}</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:22px 0">
    <h2 class="sectiontitle">${t('الحساب','Account')}</h2>
    <p class="muted">${esc(user.email||'')} · ${typeName(profile.account_type)}</p>
    <button class="btn danger" onclick="document.getElementById('logoutBtn').click()">${t('تسجيل الخروج','Sign out')}</button>
  </div>`;
}

function toggleLang(){
  lang=lang==='ar'?'en':'ar';
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('langBtn').textContent=lang==='ar'?'English':'العربية';
  document.querySelectorAll('[data-ar]').forEach(el=>{
    el.textContent=el.dataset[lang];
  });
  navigate(page);
}

navEvents();
boot();
</script>
</body>
</html>
