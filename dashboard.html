<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASLA — Workspace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#172033;
      --muted:#718096;
      --primary:#155eef;
      --primary-dark:#0d47c9;
      --primary-soft:#eaf1ff;
      --green:#12b76a;
      --green-soft:#e9f9f1;
      --orange:#f79009;
      --orange-soft:#fff4e5;
      --red:#f04438;
      --border:#e7ebf2;
      --shadow:0 12px 35px rgba(16,24,40,.07);
      --radius:20px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    button,input,textarea,select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .app{
      display:flex;
      min-height:100vh;
    }

    /* SIDEBAR */
    .sidebar{
      width:270px;
      background:#fff;
      border-left:1px solid var(--border);
      padding:22px 16px;
      position:fixed;
      right:0;
      top:0;
      bottom:0;
      z-index:50;
      display:flex;
      flex-direction:column;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      padding:4px 10px 26px;
    }

    .brand-logo{
      width:44px;
      height:44px;
      border-radius:14px;
      background:linear-gradient(135deg,#155eef,#6b8cff);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      font-weight:800;
      box-shadow:0 8px 20px rgba(21,94,239,.22);
    }

    .brand-name{
      font-size:21px;
      font-weight:800;
      letter-spacing:.5px;
    }

    .brand-sub{
      font-size:10px;
      color:var(--muted);
      margin-top:3px;
      letter-spacing:1px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .nav-btn{
      border:0;
      background:transparent;
      color:#596579;
      width:100%;
      display:flex;
      align-items:center;
      gap:13px;
      padding:13px 14px;
      border-radius:13px;
      text-align:right;
      transition:.2s;
    }

    .nav-btn:hover{
      background:#f5f8ff;
      color:var(--primary);
    }

    .nav-btn.active{
      background:var(--primary-soft);
      color:var(--primary);
      font-weight:700;
    }

    .nav-icon{
      width:22px;
      text-align:center;
      font-size:18px;
    }

    .sidebar-bottom{
      margin-top:auto;
    }

    .user-mini{
      background:#f7f9fc;
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .avatar{
      width:40px;
      height:40px;
      border-radius:12px;
      background:linear-gradient(135deg,#155eef,#7b61ff);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      flex-shrink:0;
    }

    .user-info{
      min-width:0;
    }

    .user-name{
      font-size:13px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .user-type{
      color:var(--muted);
      font-size:11px;
      margin-top:3px;
    }

    .logout{
      width:100%;
      border:1px solid var(--border);
      background:#fff;
      color:#667085;
      border-radius:12px;
      padding:10px;
    }

    /* MAIN */
    .main{
      width:calc(100% - 270px);
      margin-right:270px;
      min-height:100vh;
    }

    .topbar{
      height:76px;
      background:#fff;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 32px;
      position:sticky;
      top:0;
      z-index:30;
    }

    .page-title{
      font-size:19px;
      font-weight:800;
    }

    .page-sub{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .lang-btn,
    .mobile-menu{
      border:1px solid var(--border);
      background:#fff;
      border-radius:11px;
      padding:9px 12px;
      color:#596579;
    }

    .content{
      padding:30px;
      max-width:1500px;
      margin:auto;
    }

    /* HERO */
    .hero{
      background:linear-gradient(135deg,#0f4cdb,#3b6ff4 60%,#6d7ff7);
      border-radius:24px;
      padding:30px;
      color:white;
      box-shadow:0 18px 45px rgba(21,94,239,.2);
      position:relative;
      overflow:hidden;
      margin-bottom:24px;
    }

    .hero:after{
      content:"";
      position:absolute;
      width:280px;
      height:280px;
      border-radius:50%;
      background:rgba(255,255,255,.09);
      left:-70px;
      top:-120px;
    }

    .hero h1{
      font-size:28px;
      margin-bottom:8px;
      position:relative;
      z-index:2;
    }

    .hero p{
      color:rgba(255,255,255,.82);
      max-width:700px;
      line-height:1.8;
      position:relative;
      z-index:2;
    }

    /* CARDS */
    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      margin-bottom:24px;
    }

    .stat{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px;
      box-shadow:var(--shadow);
    }

    .stat-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .stat-icon{
      width:42px;
      height:42px;
      border-radius:13px;
      background:var(--primary-soft);
      color:var(--primary);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:19px;
    }

    .stat-number{
      font-size:30px;
      font-weight:800;
      margin-top:16px;
    }

    .stat-label{
      color:var(--muted);
      font-size:13px;
      margin-top:4px;
    }

    .section{
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      margin-bottom:22px;
      overflow:hidden;
    }

    .section-head{
      padding:20px 22px;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .section-title{
      font-size:17px;
      font-weight:800;
    }

    .section-body{
      padding:20px;
    }

    /* INQUIRY */
    .inquiry{
      border:1px solid var(--border);
      border-radius:16px;
      padding:17px;
      margin-bottom:12px;
      background:#fff;
    }

    .inquiry:last-child{
      margin-bottom:0;
    }

    .inquiry-head{
      display:flex;
      justify-content:space-between;
      gap:15px;
      margin-bottom:10px;
    }

    .inquiry-product{
      font-weight:800;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:5px 10px;
      border-radius:20px;
      font-size:11px;
      font-weight:700;
    }

    .badge-green{
      background:var(--green-soft);
      color:#087443;
    }

    .badge-orange{
      background:var(--orange-soft);
      color:#b54708;
    }

    .badge-blue{
      background:var(--primary-soft);
      color:var(--primary);
    }

    .inquiry-message{
      color:#596579;
      font-size:13px;
      line-height:1.8;
      background:#f8fafc;
      border-radius:12px;
      padding:12px;
    }

    .reply{
      margin-top:10px;
      border-right:3px solid var(--green);
      background:#f0fbf6;
      padding:12px;
      border-radius:10px;
      color:#344054;
      font-size:13px;
      line-height:1.8;
    }

    /* PRODUCTS */
    .product-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .product-card{
      border:1px solid var(--border);
      border-radius:17px;
      padding:18px;
      background:#fff;
      transition:.2s;
    }

    .product-card:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 30px rgba(16,24,40,.08);
    }

    .product-image{
      height:130px;
      background:linear-gradient(135deg,#eef3ff,#f7f9ff);
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      margin-bottom:15px;
      overflow:hidden;
    }

    .product-image img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .product-name{
      font-weight:800;
      margin-bottom:7px;
    }

    .product-company{
      color:var(--muted);
      font-size:12px;
    }

    .product-desc{
      color:#667085;
      font-size:12px;
      line-height:1.7;
      margin-top:10px;
    }

    /* PROFILE */
    .profile-cover{
      height:170px;
      background:linear-gradient(135deg,#0f4cdb,#7568f5);
      border-radius:20px 20px 0 0;
    }

    .profile-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .profile-main{
      padding:0 25px 25px;
      position:relative;
    }

    .profile-avatar{
      width:90px;
      height:90px;
      border-radius:25px;
      background:linear-gradient(135deg,#155eef,#7b61ff);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      font-weight:800;
      border:5px solid white;
      margin-top:-45px;
      position:relative;
    }

    .profile-name{
      font-size:23px;
      font-weight:800;
      margin-top:12px;
    }

    .profile-role{
      color:var(--muted);
      margin-top:5px;
    }

    .profile-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
      margin-top:25px;
    }

    .profile-field{
      background:#f8fafc;
      border:1px solid var(--border);
      padding:15px;
      border-radius:14px;
    }

    .field-label{
      font-size:11px;
      color:var(--muted);
      margin-bottom:6px;
    }

    .field-value{
      font-weight:700;
      font-size:14px;
    }

    /* FORMS */
    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .field.full{
      grid-column:1/-1;
    }

    .field label{
      font-size:12px;
      font-weight:700;
      color:#475467;
    }

    .field input,
    .field textarea,
    .field select{
      border:1px solid #d9dee8;
      border-radius:12px;
      padding:12px;
      outline:none;
      background:#fff;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(21,94,239,.1);
    }

    .primary-btn{
      border:0;
      background:var(--primary);
      color:white;
      border-radius:12px;
      padding:12px 18px;
      font-weight:700;
    }

    .primary-btn:hover{
      background:var(--primary-dark);
    }

    .secondary-btn{
      border:1px solid var(--border);
      background:white;
      color:#475467;
      border-radius:12px;
      padding:11px 16px;
    }

    /* DISCOVER */
    .discover-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .company-card{
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px;
      background:#fff;
    }

    .company-logo{
      width:52px;
      height:52px;
      border-radius:15px;
      background:var(--primary-soft);
      color:var(--primary);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:20px;
      margin-bottom:14px;
    }

    .company-name{
      font-weight:800;
      font-size:16px;
    }

    .company-location{
      color:var(--muted);
      font-size:12px;
      margin-top:6px;
    }

    /* EMPTY */
    .empty{
      padding:45px 20px;
      text-align:center;
      color:var(--muted);
    }

    .empty-icon{
      font-size:38px;
      margin-bottom:10px;
      opacity:.7;
    }

    /* LOADING */
    .loading{
      min-height:70vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:15px;
      color:var(--muted);
    }

    .spinner{
      width:42px;
      height:42px;
      border:4px solid #e4e9f2;
      border-top-color:var(--primary);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .notice{
      position:fixed;
      left:25px;
      bottom:25px;
      max-width:420px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 15px 40px rgba(0,0,0,.15);
      border-radius:15px;
      padding:15px 18px;
      z-index:100;
      display:none;
      font-size:13px;
    }

    .notice.show{
      display:block;
    }

    .notice.error{
      border-right:4px solid var(--red);
    }

    .notice.success{
      border-right:4px solid var(--green);
    }

    /* MOBILE */
    .mobile-menu{
      display:none;
    }

    @media(max-width:1050px){
      .product-grid,
      .discover-grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:800px){
      .sidebar{
        transform:translateX(100%);
        transition:.25s;
      }

      .sidebar.open{
        transform:translateX(0);
      }

      .main{
        width:100%;
        margin-right:0;
      }

      .mobile-menu{
        display:block;
      }

      .topbar{
        padding:0 16px;
      }

      .content{
        padding:18px;
      }

      .stats{
        grid-template-columns:1fr;
      }

      .product-grid,
      .discover-grid{
        grid-template-columns:1fr;
      }

      .profile-grid,
      .form-grid{
        grid-template-columns:1fr;
      }

      .hero{
        padding:23px;
      }

      .hero h1{
        font-size:23px;
      }
    }
  </style>
</head>

<body>

<div id="app" class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-logo">W</div>
      <div>
        <div class="brand-name">WASLA</div>
        <div class="brand-sub">GLOBAL BUSINESS NETWORK</div>
      </div>
    </div>

    <nav class="nav">

      <button class="nav-btn active" data-page="overview" onclick="navigate('overview')">
        <span class="nav-icon">⌂</span>
        <span>الرئيسية</span>
      </button>

      <button class="nav-btn" data-page="inbox" onclick="navigate('inbox')">
        <span class="nav-icon">✉</span>
        <span>الرسائل والاستفسارات</span>
      </button>

      <button class="nav-btn" data-page="profile" onclick="navigate('profile')">
        <span class="nav-icon">♙</span>
        <span>الملف الشخصي</span>
      </button>

      <button class="nav-btn" data-page="company" id="companyNav" onclick="navigate('company')">
        <span class="nav-icon">▣</span>
        <span>الشركة</span>
      </button>

      <button class="nav-btn" data-page="products" id="productsNav" onclick="navigate('products')">
        <span class="nav-icon">◈</span>
        <span>المنتجات</span>
      </button>

      <button class="nav-btn" data-page="discover" onclick="navigate('discover')">
        <span class="nav-icon">⌕</span>
        <span>اكتشاف</span>
      </button>

      <button class="nav-btn" data-page="settings" onclick="navigate('settings')">
        <span class="nav-icon">⚙</span>
        <span>الإعدادات</span>
      </button>

    </nav>

    <div class="sidebar-bottom">

      <div class="user-mini">
        <div class="avatar" id="sideAvatar">W</div>
        <div class="user-info">
          <div class="user-name" id="sideName">WASLA User</div>
          <div class="user-type" id="sideType">Account</div>
        </div>
      </div>

      <button class="logout" onclick="logout()">تسجيل الخروج</button>

    </div>
  </aside>

  <main class="main">

    <header class="topbar">

      <div>
        <div class="page-title" id="pageTitle">WASLA WORKSPACE</div>
        <div class="page-sub" id="pageSub">إدارة حضورك التجاري من مكان واحد</div>
      </div>

      <div class="top-actions">
        <button class="lang-btn" onclick="toggleLanguage()">English</button>
        <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
      </div>

    </header>

    <div id="content" class="content">
      <div class="loading">
        <div class="spinner"></div>
        <div>جاري تحميل مساحة WASLA...</div>
      </div>
    </div>

  </main>

</div>

<div id="notice" class="notice"></div>

<script>
const SUPABASE_URL='https://bzrcbodvcuujdjupfgzw.supabase.co';
const SUPABASE_KEY='sb_publishable_EAWH4688yaEOk537GOBWIg_Hz4DPN3u';

const db=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user=null;
let profile=null;
let company=null;
let products=[];
let inquiries=[];
let language='ar';

function rel(value){
  if(Array.isArray(value)) return value[0] || null;
  return value || null;
}

function status(value){
  const names={
    published:['منشور','Published'],
    draft:['مسودة','Draft'],
    pending:['قيد الانتظار','Pending'],
    active:['نشط','Active'],
    inactive:['غير نشط','Inactive'],
    archived:['مؤرشف','Archived']
  };

  return names[value]
    ? (language==='ar'?names[value][0]:names[value][1])
    : (value||'');
}

function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function showNotice(message,error=false){
  const el=document.getElementById('notice');

  el.textContent=message;
  el.className='notice show '+(error?'error':'success');

  setTimeout(()=>{
    el.className='notice';
  },4500);
}

function initials(name){
  if(!name) return 'W';

  return name
    .split(' ')
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join('')
    .toUpperCase();
}

function accountTypeName(type){
  const names={
    buyer:['مشتري','Buyer'],
    company:['شركة','Company'],
    manufacturer:['مصنّع','Manufacturer'],
    brand:['علامة تجارية','Brand'],
    trader:['تاجر','Trader']
  };

  return names[type]
    ? (language==='ar'?names[type][0]:names[type][1])
    : (type||'');
}

async function boot(){

  try{

    const {data,error}=await db.auth.getSession();

    if(error) throw error;

    if(!data.session){
      document.getElementById('content').innerHTML=`
        <div class="section">
          <div class="empty">
            <div class="empty-icon">🔐</div>
            <h3>يجب تسجيل الدخول أولاً</h3>
          </div>
        </div>
      `;
      return;
    }

    user=data.session.user;

    const profileResult=await db
      .from('profiles')
      .select('*')
      .eq('id',user.id)
      .single();

    if(profileResult.error) throw profileResult.error;

    profile=profileResult.data;

    updateUserUI();

    await loadCompany();
    await loadProducts();
    await loadInquiries();

    navigate('overview');

  }catch(error){

    console.error('WASLA boot error:',error);

    showNotice(
      'تعذّر تحميل الحساب: '+(error.message || 'Unknown error'),
      true
    );

    document.getElementById('content').innerHTML=`
      <div class="section">
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <h3>تعذّر تحميل الحساب</h3>
          <p style="margin-top:8px">${esc(error.message || '')}</p>
        </div>
      </div>
    `;
  }
}

function updateUserUI(){

  const name=
    profile?.full_name ||
    user?.email?.split('@')[0] ||
    'WASLA User';

  const type=
    profile?.account_type ||
    'buyer';

  document.getElementById('sideName').textContent=name;
  document.getElementById('sideType').textContent=accountTypeName(type);
  document.getElementById('sideAvatar').textContent=initials(name);

  const business=type!=='buyer';

  document.getElementById('companyNav').style.display=
    business?'flex':'none';

  document.getElementById('productsNav').style.display=
    business?'flex':'none';
}

async function loadCompany(){

  company=null;

  if(!user) return;

  const {data,error}=await db
    .from('companies')
    .select('*')
    .eq('owner_id',user.id)
    .maybeSingle();

  if(error){
    console.warn('Company load:',error);
    return;
  }

  company=data;
}

async function loadProducts(){

  products=[];

  if(!company) return;

  const {data,error}=await db
    .from('products')
    .select('*')
    .eq('company_id',company.id)
    .order('created_at',{ascending:false});

  if(error){
    console.warn('Products load:',error);
    return;
  }

  products=data || [];
}

async function loadInquiries(){

  inquiries=[];

  if(!user) return;

  let query=db
    .from('inquiries')
    .select('*,products(name),companies(name)')
    .order('created_at',{ascending:false});

  if(profile?.account_type==='buyer'){
    query=query.eq('buyer_id',user.id);
  }else if(company){
    query=query.eq('company_id',company.id);
  }else{
    return;
  }

  const {data,error}=await query;

  if(error){
    console.warn('Inquiries load:',error);
    return;
  }

  inquiries=data || [];
}

function navigate(page){

  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.toggle(
      'active',
      btn.dataset.page===page
    );
  });

  const titles={
    overview:['WASLA WORKSPACE','إدارة حضورك التجاري من مكان واحد'],
    inbox:['الرسائل والاستفسارات','تابع جميع استفساراتك وتواصلك التجاري'],
    profile:['الملف الشخصي','معلومات حسابك على WASLA'],
    company:['الشركة','إدارة معلومات شركتك'],
    products:['المنتجات','إدارة المنتجات والخدمات المعروضة'],
    discover:['اكتشاف','اكتشف المنتجات والشركات داخل شبكة WASLA'],
    settings:['الإعدادات','إعدادات حسابك']
  };

  document.getElementById('pageTitle').textContent=titles[page][0];
  document.getElementById('pageSub').textContent=titles[page][1];

  const content=document.getElementById('content');

  if(page==='overview') renderOverview(content);
  if(page==='inbox') renderInbox(content);
  if(page==='profile') renderProfile(content);
  if(page==='company') renderCompany(content);
  if(page==='products') renderProducts(content);
  if(page==='discover') renderDiscover(content);
  if(page==='settings') renderSettings(content);

  document.getElementById('sidebar').classList.remove('open');

  window.scrollTo({top:0,behavior:'smooth'});
}

function renderOverview(el){

  const answered=inquiries.filter(x=>
    x.status==='answered' ||
    x.status==='responded' ||
    x.reply
  ).length;

  const pending=inquiries.length-answered;

  const name=
    profile?.full_name ||
    user?.email?.split('@')[0] ||
    'صديقي';

  const latest=inquiries.slice(0,3);

  el.innerHTML=`

    <div class="hero">
      <h1>مرحباً بك في WASLA 👋</h1>
      <p>
        مساحة واحدة لإدارة حضورك التجاري،
        اكتشاف الفرص، والتواصل مع الشركات والعملاء
        داخل شبكة أعمال عالمية.
      </p>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-top">
          <div class="stat-label">إجمالي الاستفسارات</div>
          <div class="stat-icon">✉</div>
        </div>
        <div class="stat-number">${inquiries.length}</div>
        <div class="stat-label">جميع استفساراتك</div>
      </div>

      <div class="stat">
        <div class="stat-top">
          <div class="stat-label">بانتظار الرد</div>
          <div class="stat-icon" style="background:var(--orange-soft);color:var(--orange)">◷</div>
        </div>
        <div class="stat-number">${pending}</div>
        <div class="stat-label">استفسارات تحتاج متابعة</div>
      </div>

      <div class="stat">
        <div class="stat-top">
          <div class="stat-label">تم الرد عليها</div>
          <div class="stat-icon" style="background:var(--green-soft);color:var(--green)">✓</div>
        </div>
        <div class="stat-number">${answered}</div>
        <div class="stat-label">استفسارات تمت معالجتها</div>
      </div>

    </div>

    <div class="section">

      <div class="section-head">
        <div class="section-title">آخر النشاطات</div>

        <button class="secondary-btn" onclick="navigate('inbox')">
          فتح الوارد
        </button>
      </div>

      <div class="section-body">

        ${
          latest.length
          ? latest.map(renderInquiry).join('')
          : `
            <div class="empty">
              <div class="empty-icon">📭</div>
              <div>لا توجد استفسارات حتى الآن</div>
            </div>
          `
        }

      </div>

    </div>

  `;
}

function renderInquiry(item){

  const product=rel(item.products);

  const productName=
    product?.name ||
    'استفسار تجاري';

  const replied=
    !!item.reply ||
    item.status==='answered' ||
    item.status==='responded';

  return `

    <div class="inquiry">

      <div class="inquiry-head">

        <div class="product-name">
          ${esc(productName)}
        </div>

        <span class="badge ${replied?'badge-green':'badge-orange'}">
          ${replied?'تم الرد':'بانتظار الرد'}
        </span>

      </div>

      <div class="inquiry-message">
        ${esc(item.message || 'لا توجد رسالة')}
      </div>

      ${
        item.reply
        ? `
          <div class="reply">
            <strong>الرد:</strong><br>
            ${esc(item.reply)}
          </div>
        `
        : ''
      }

    </div>
  `;
}

function renderInbox(el){

  el.innerHTML=`

    <div class="section">

      <div class="section-head">
        <div>
          <div class="section-title">الرسائل والاستفسارات</div>
          <div class="page-sub">كل التواصل التجاري في مكان واحد</div>
        </div>
      </div>

      <div class="section-body">

        ${
          inquiries.length
          ? inquiries.map(renderInquiry).join('')
          : `
            <div class="empty">
              <div class="empty-icon">💬</div>
              <h3>لا توجد رسائل بعد</h3>
              <p style="margin-top:8px">
                عندما يصلك استفسار تجاري سيظهر هنا.
              </p>
            </div>
          `
        }

      </div>

    </div>

  `;
}

    <div class="profile-card">

          ${esc(initials(name))}

        <div class="profile-name">

              ${esc(profile?.full_name || 'غير محدد')}

          </div>

          <div class="profile-field">
            <div class="field-label">البريد الإلكتروني</div>

          </div>

          <div class="profile-field">

            <div class="field-value" style="color:var(--green)">
              ● نشط
            </div>
          </div>

        </div>

      </div>

    </div>

function renderCompany(el){

  if(!company){

    el.innerHTML=`
      <div class="section">
        <div class="empty">
          <div class="empty-icon">🏢</div>
          <h3>لم يتم العثور على شركة مرتبطة بحسابك</h3>
        </div>

  }

  el.innerHTML=`

    <div class="section">

        <div>

      </div>

      <div class="section-body">

        <div class="form-grid">

            <label>اسم الشركة</label>

function renderProducts(el){

  if(!company){

    el.innerHTML=`
      <div class="section">
        <div class="empty">
          <div class="empty-icon">📦</div>
          <h3>المنتجات متاحة للحسابات التجارية</h3>
        </div>
      </div>
    `;

    return;
  }

  el.innerHTML=`

    <div class="section">

      <div class="section-head">
        <div>
          <div class="section-title">منتجات شركتك</div>
          <div class="page-sub">${products.length} منتج</div>
        </div>
      </div>

      <div class="section-body">

        ${
          products.length
          ? `
            <div class="product-grid">
              ${products.map(p=>`

                <div class="product-card">

                  <div class="product-image">

                    ${
                      p.image_url
                      ? `<img src="${esc(p.image_url)}" alt="">`
                      : '📦'
                    }

                  </div>

                  <div class="product-name">
                    ${esc(p.name || 'منتج')}
                  </div>

                  <div class="product-company">
                    ${esc(p.category || 'منتج تجاري')}
                  </div>

                  <div class="product-desc">
                    ${esc(p.description || 'لا يوجد وصف')}
                  </div>

                  <div style="margin-top:13px">
                    <span class="badge ${
                      p.status==='published'

                      : 'badge-orange'

                      ${esc(status(p.status))}

          `
          : `
            <div class="empty">
              <div class="empty-icon">📦</div>
              <h3>لا توجد منتجات</h3>
              <p style="margin-top:8px">
                ستظهر منتجات شركتك هنا.
              </p>
            </div>
          `
        }

      </div>

    </div>

  `;
}

async function renderDiscover(el){

  el.innerHTML=`

    <div class="section">

      <div class="section-head">
        <div>
          <div class="section-title">اكتشاف</div>
          <div class="page-sub">
            منتجات وشركات منشورة داخل شبكة WASLA
          </div>
        </div>
      </div>

      <div class="section-body">

        <div id="discoverResults">

          <div class="empty">
            <div class="spinner" style="margin:auto"></div>
            <div style="margin-top:12px">
              جاري البحث...
            </div>
          </div>

        </div>

      </div>

    </div>
  `;

  try{

    const {data,error}=await db
      .from('products')
      .select('*,companies(name,country,city)')
      .eq('status','published')
      .order('created_at',{ascending:false});

    if(error) throw error;

    const results=data || [];

    document.getElementById('discoverResults').innerHTML=
      results.length
      ? `
        <div class="discover-grid">

          ${results.map(p=>{

            const c=rel(p.companies);

            return `

              <div class="company-card">

                <div class="company-logo">
                  ${esc(initials(c?.name || 'WASLA'))}
                </div>

                <div class="company-name">
                  ${esc(c?.name || 'شركة')}
                </div>

                <div class="company-location">
                  ${esc(c?.country || '')}
                  ${c?.city?' • '+esc(c.city):''}
                </div>

                <div style="margin-top:18px">

                  <strong>
                    ${esc(p.name || 'منتج')}
                  </strong>

                  <div class="product-desc">
                    ${esc(p.description || '')}
                  </div>

                </div>

              </div>

            `;

          }).join('')}

        </div>
      `
      : `
        <div class="empty">
          <div class="empty-icon">🔎</div>
          <h3>لا توجد منتجات منشورة حالياً</h3>
        </div>
      `;

  }catch(error){

    console.error(error);

    document.getElementById('discoverResults').innerHTML=`
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <h3>تعذّر تحميل المنتجات</h3>
        <p style="margin-top:8px">${esc(error.message || '')}</p>
      </div>
    `;
  }
}

function renderSettings(el){

  el.innerHTML=`

    <div class="section">

      <div class="section-head">
        <div>
          <div class="section-title">إعدادات الحساب</div>
          <div class="page-sub">إدارة تفضيلات WASLA</div>
        </div>
      </div>

      <div class="section-body">

        <div class="profile-field" style="margin-bottom:12px">
          <div class="field-label">اللغة</div>
          <div class="field-value">العربية</div>
        </div>

        <div class="profile-field" style="margin-bottom:12px">
          <div class="field-label">البريد الإلكتروني</div>
          <div class="field-value">${esc(user?.email || '')}</div>
        </div>

        <button class="primary-btn" onclick="logout()">
          تسجيل الخروج
        </button>

      </div>

    </div>

  `;
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}

function toggleLanguage(){

  language=language==='ar'?'en':'ar';

  document.documentElement.lang=language;
  document.documentElement.dir=language==='ar'?'rtl':'ltr';

  const active=document.querySelector('.nav-btn.active');

  if(active){
    navigate(active.dataset.page);
  }

  document.querySelector('.lang-btn').textContent=
    language==='ar'?'English':'العربية';
}

async function logout(){

  await db.auth.signOut();

  window.location.href='index.html';
}

boot();
</script>
