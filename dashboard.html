<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b3f">
<title>WASLA | مساحة أعمالك</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --navy:#102b3f;
  --navy2:#173c52;
  --teal:#13a889;
  --mint:#dff6ef;
  --ink:#172d3b;
  --muted:#71818c;
  --line:#e6edf0;
  --bg:#f4f7f8;
  --white:#fff;
  --shadow:0 12px 35px #1834470b
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif
}

button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}

.shell{min-height:100vh}

.top{
  height:72px;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 5px 22px #102b3f20
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:900;
  font-size:23px;
  letter-spacing:1px
}

.brandmark{
  width:34px;
  height:34px;
  border-radius:11px;
  background:linear-gradient(135deg,#53e0bd,#0c9b83);
  display:grid;
  place-items:center;
  color:#103448;
  font-size:19px
}

.brand small{
  display:block;
  font-size:9px;
  letter-spacing:2px;
  color:#b8d1d9;
  margin-top:2px
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px
}

.top button{
  color:#fff;
  background:#ffffff16;
  border:1px solid #ffffff25;
  padding:9px 13px;
  border-radius:10px
}

.layout{
  display:grid;
  grid-template-columns:248px minmax(0,1fr);
  max-width:1600px;
  margin:auto;
  min-height:calc(100vh - 72px)
}

aside{
  background:#fff;
  border-inline-end:1px solid var(--line);
  padding:25px 16px
}

.userbox{
  padding:14px;
  border-radius:15px;
  background:#f5f9fa;
  margin-bottom:25px
}

.avatar{
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--mint);
  color:#087d68;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:17px
}

.userrow{
  display:flex;
  align-items:center;
  gap:11px
}

.userbox strong{
  display:block;
  font-size:14px
}

.userbox small{
  color:var(--muted);
  font-size:11px
}

.navlabel{
  font-size:10px;
  color:#9aa8af;
  font-weight:800;
  padding:8px 12px 10px
}

.navbtn{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:11px;
  background:transparent;
  color:#536673;
  text-align:start;
  margin:3px 0;
  font-weight:650
}

.navbtn .ico{
  width:23px;
  text-align:center;
  font-size:17px
}

.navbtn.active{
  background:#e8f7f3;
  color:#087e69
}

.navbtn:hover{
  background:#f3f8f8
}

.navfoot{
  margin-top:28px;
  border-top:1px solid var(--line);
  padding-top:16px
}

.main{
  padding:30px;
  min-width:0
}

.pagehead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  margin-bottom:24px
}

.eyebrow{
  font-size:11px;
  color:var(--teal);
  font-weight:800;
  letter-spacing:1px
}

.pagehead h1{
  font-size:27px;
  margin:6px 0
}

.sub{
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
  margin:0
}

.btn{
  padding:11px 16px;
  border-radius:11px;
  background:var(--teal);
  color:#fff;
  font-weight:750
}

.btn.secondary{
  background:#edf3f5;
  color:#294454
}

.btn.ghost{
  background:#fff;
  color:#37515f;
  border:1px solid var(--line)
}

.btn.danger{
  background:#fff0ef;
  color:#b54742
}

.btn:disabled{
  opacity:.55;
  cursor:wait
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:20px;
  box-shadow:var(--shadow);
  min-width:0
}

/* بطاقات الواجهة الرئيسية الجديدة */
.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin-top:16px
}

.quick-card{
  position:relative;
  min-height:145px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:17px;
  background:#fff;
  box-shadow:var(--shadow);
  text-align:start;
  transition:.18s ease;
  cursor:pointer;
  color:var(--ink)
}

.quick-card:hover{
  transform:translateY(-3px);
  border-color:#b8e5da;
  box-shadow:0 16px 35px #18344718
}

.quick-card:active{
  transform:translateY(0)
}

.quick-icon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#eaf7f3;
  color:#0b987c;
  display:grid;
  place-items:center;
  font-size:21px;
  margin-bottom:17px
}

.quick-card h3{
  margin:0 0 6px;
  font-size:15px
}

.quick-card p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.7
}

.quick-arrow{
  position:absolute;
  left:18px;
  bottom:17px;
  color:#0b987c;
  font-size:17px
}

.stat{
  display:flex;
  align-items:center;
  justify-content:space-between
}

.stat .number{
  font-size:28px;
  font-weight:850;
  margin-top:12px
}

.stat .symbol{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#eaf7f3;
  color:#0b987c;
  display:grid;
  place-items:center;
  font-size:20px
}

.sectiontitle{
  font-size:17px;
  margin:0 0 15px
}

.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.8
}

.stack{
  display:grid;
  gap:15px
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.field{
  width:100%;
  padding:12px 13px;
  border:1px solid #dfe8eb;
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  outline:none
}

.field:focus{
  border-color:#38b99e;
  box-shadow:0 0 0 3px #13a88918
}

textarea.field{
  min-height:105px;
  resize:vertical
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.formgrid label{
  display:grid;
  gap:6px;
  font-size:12px;
  color:#526672
}

.full{
  grid-column:1/-1
}

.notice{
  padding:12px 14px;
  border-radius:11px;
  background:#eef7f5;
  color:#176c5b;
  font-size:13px;
  margin-bottom:16px
}

.notice.error{
  background:#fff0ef;
  color:#a33d38
}

.hidden{
  display:none!important
}

.list{
  display:grid;
  gap:10px
}

.entry{
  border:1px solid var(--line);
  border-radius:13px;
  padding:15px;
  background:#fff
}

.entry h3{
  font-size:14px;
  margin:0 0 6px
}

.entry p{
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
  margin:5px 0
}

.tag{
  display:inline-flex;
  padding:5px 9px;
  border-radius:30px;
  background:#edf7f4;
  color:#14836e;
  font-size:11px
}

.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:15px
}

.toolbar .field{
  max-width:360px
}

.inbox{
  display:grid;
  grid-template-columns:minmax(270px,350px) minmax(0,1fr);
  min-height:590px;
  overflow:hidden;
  padding:0
}

.conversations{
  border-inline-end:1px solid var(--line);
  background:#fbfdfd
}

.inboxhead{
  padding:19px;
  border-bottom:1px solid var(--line)
}

.inboxhead h2{
  margin:0 0 12px;
  font-size:18px
}

.conversation{
  width:100%;
  border:0;
  background:transparent;
  text-align:start;
  display:flex;
  gap:11px;
  padding:14px 16px;
  border-bottom:1px solid #edf1f2;
  color:var(--ink)
}

.conversation:hover,
.conversation.selected{
  background:#eaf7f3
}

.convavatar{
  flex:0 0 40px;
  height:40px;
  border-radius:13px;
  background:#e5eef2;
  color:#31596b;
  display:grid;
  place-items:center;
  font-weight:800
}

.convbody{
  min-width:0;
  flex:1
}

.convtop{
  display:flex;
  justify-content:space-between;
  gap:8px
}

.convtop strong{
  font-size:12px
}

.convtop time{
  font-size:10px;
  color:#87969e;
  white-space:nowrap
}

.preview{
  font-size:11px;
  color:#77868e;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:6px
}

.thread{
  display:flex;
  flex-direction:column;
  min-width:0;
  background:#fff
}

.threadhead{
  padding:17px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:11px
}

.threadhead strong{
  font-size:14px
}

.threadbody{
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
  flex:1;
  min-height:350px;
  max-height:490px;
  overflow:auto;
  background:linear-gradient(#fff,#fbfdfd)
}

.bubble{
  max-width:min(78%,560px);
  padding:11px 14px;
  border-radius:15px;
  background:#f0f4f6;
  align-self:flex-start
}

.bubble.mine{
  background:#dff6ef;
  align-self:flex-end
}

.bubble p{
  margin:0;
  font-size:13px;
  line-height:1.75;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.bubble time{
  display:block;
  text-align:end;
  color:#819098;
  font-size:10px;
  margin-top:5px
}

.composer{
  border-top:1px solid var(--line);
  padding:15px;
  display:flex;
  gap:9px;
  align-items:flex-end
}

.composer textarea{
  min-height:44px;
  max-height:120px
}

.empty{
  height:100%;
  min-height:300px;
  display:grid;
  place-items:center;
  text-align:center;
  color:#87969e;
  padding:25px
}

.empty b{
  display:block;
  color:#385261;
  margin-bottom:7px
}

.skeleton{
  height:14px;
  background:linear-gradient(90deg,#edf2f3,#f8fafa,#edf2f3);
  background-size:200% 100%;
  animation:shine 1.2s infinite;
  border-radius:8px
}

@keyframes shine{
  to{background-position:-200% 0}
}

.content{
  animation:fade .16s ease
}

@keyframes fade{
  from{opacity:.55;transform:translateY(3px)}
  to{opacity:1;transform:none}
}

.mobilemenu{
  display:none
}

.footerhint{
  font-size:11px;
  color:#9aa7ad;
  line-height:1.7;
  margin-top:25px
}

@media(max-width:1100px){
  .quick-grid{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
}

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr
  }

  aside{
    position:fixed;
    z-index:30;
    inset-block:72px;
    inset-inline-start:0;
    width:260px;
    transform:translateX(110%);
    transition:transform .2s;
    box-shadow:0 15px 35px #102b3f20
  }

  .layout.menu-open aside{
    transform:translateX(0)
  }

  .mobilemenu{
    display:inline-block
  }

  .main{
    padding:22px 16px
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
}

@media(max-width:620px){
  .top{
    padding:0 14px;
    height:64px
  }

  .layout{
    min-height:calc(100vh - 64px)
  }

  aside{
    inset-block-start:64px
  }

  .main{
    padding:18px 12px
  }

  .grid,
  .quick-grid{
    grid-template-columns:1fr
  }

  .pagehead{
    align-items:flex-start
  }

  .pagehead h1{
    font-size:22px
  }

  .inbox{
    grid-template-columns:1fr;
    min-height:0
  }

  .conversations{
    border-inline-end:0
  }

  .thread{
    min-height:520px
  }

  .conversation{
    padding:12px
  }

  .formgrid{
    grid-template-columns:1fr
  }

  .full{
    grid-column:auto
  }

  .top-actions button{
    padding:8px 9px;
    font-size:11px
  }
}
</style>
</head>

<body>

<div class="shell">

<header class="top">

  <div class="brand">
    <span class="brandmark">W</span>
    <span>
      WASLA
      <small>GLOBAL BUSINESS NETWORK</small>
    </span>
  </div>

  <div class="top-actions">
    <button class="mobilemenu" id="menuBtn">☰</button>
    <button id="langBtn">English</button>
    <button id="logoutBtn">تسجيل الخروج</button>
  </div>

</header>

<div class="layout" id="layout">

<aside>

  <div class="userbox">
    <div class="userrow">
      <div class="avatar" id="avatar">W</div>

      <div>
        <strong id="userName">جارٍ التحميل…</strong>
        <small id="userType">WASLA member</small>
      </div>
    </div>
  </div>

  <div class="navlabel">مساحة العمل</div>

  <nav id="nav">

    <button class="navbtn active" data-page="overview">
      <span class="ico">◫</span>
      <span>نظرة عامة</span>
    </button>

    <button class="navbtn" data-page="discover">
      <span class="ico">⌕</span>
      <span>استكشاف السوق</span>
    </button>

    <button class="navbtn business-only" data-page="products">
      <span class="ico">▦</span>
      <span>منتجاتي</span>
    </button>

    <button class="navbtn" data-page="inbox">
      <span class="ico">✉</span>
      <span>صندوق الوارد</span>
    </button>

    <button class="navbtn" data-page="company">
      <span class="ico">▤</span>
      <span>ملف النشاط</span>
    </button>

  </nav>

  <div class="navfoot">

    <button class="navbtn" data-page="settings">
      <span class="ico">⚙</span>
      <span>الإعدادات</span>
    </button>

  </div>

  <p class="footerhint">
    WASLA · Business, Connected.<br>
    نسخة تشغيلية مرتبطة بقاعدة بياناتك الحالية.
  </p>

</aside>

<main class="main">

  <div id="notice" class="notice hidden" role="status"></div>

  <div id="page" class="content">

    <div class="card">
      <div class="skeleton" style="width:35%"></div>
      <br>
      <div class="skeleton" style="width:75%"></div>
    </div>

  </div>

</main>

</div>
</div>

<script>
'use strict';

const SUPABASE_URL='https://bzrcbodvcuujdjupfgzw.supabase.co';

const SUPABASE_PUBLISHABLE_KEY='sb_publishable_EAWH4688yaEOk537GOBWIg_Hz4DPN3u';

const db=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let user=null;
let profile=null;
let company=null;
let lang='ar';
let page='overview';
let products=[];
let inquiries=[];
let activeInquiry=null;
let messages=[];

const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(
  /[&<>"']/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

const t=(a,e)=>lang==='ar'?a:e;

const rel=x=>Array.isArray(x)?x[0]:x;

function notify(msg,error=false){
  $('notice').textContent=msg;
  $('notice').classList.toggle('error',error);
  $('notice').classList.remove('hidden');
}

function hideNotice(){
  $('notice').classList.add('hidden');
}

function date(v){
  return v
    ? new Date(v).toLocaleString(
        lang==='ar'?'ar':'en-GB',
        {
          dateStyle:'medium',
          timeStyle:'short'
        }
      )
    : '';
}

function typeName(v){
  return (
    {
      buyer:['مشتري','Buyer'],
      company:['شركة','Company'],
      manufacturer:['مصنّع','Manufacturer'],
      brand:['علامة تجارية','Brand'],
      trader:['تاجر','Trader']
    }[v]||[v||'عضو','Member']
  )[lang==='ar'?0:1];
}

function status(v){
  return (
    {
      pending:['قيد المراجعة','Pending review'],
      published:['منشور','Published'],
      suspended:['موقوف','Suspended'],
      responded:['تم الرد','Responded'],
      closed:['مغلق','Closed']
    }[v]||[v||'—',v||'—']
  )[lang==='ar'?0:1];
}

async function boot(){

  const {
    data:{user:u},
    error
  }=await db.auth.getUser();

  if(error||!u){

    $('page').innerHTML=`
      <div class="card empty">
        <div>
          <b>${t('يلزم تسجيل الدخول','Sign in required')}</b>
          ${t(
            'سجّل الدخول من صفحة WASLA الرئيسية ثم افتح لوحة التحكم.',
            'Sign in from the WASLA home page, then open the dashboard.'
          )}
        </div>
      </div>
    `;

    return;
  }

  user=u;

  const r=await db
    .from('profiles')
    .select('id,full_name,account_type')
    .eq('id',u.id)
    .maybeSingle();

  if(r.error||!r.data){

    notify(
      r.error?.message||'لا يوجد ملف مستخدم في profiles',
      true
    );

    return;
  }

  profile=r.data;

  $('userName').textContent=
    profile.full_name||u.email;

  $('userType').textContent=
    typeName(profile.account_type);

  $('avatar').textContent=
    (profile.full_name||u.email||'W')
      .trim()
      .charAt(0)
      .toUpperCase();

  if(profile.account_type==='buyer'){

    document
      .querySelectorAll('.business-only')
      .forEach(x=>x.classList.add('hidden'));

  }

  await loadCompany();

  await navigate('overview');
}

async function loadCompany(){

  if(profile.account_type==='buyer') return;

  const r=await db
    .from('companies')
    .select('*')
    .eq('owner_id',user.id)
    .limit(1);

  if(r.error){

    notify(
      'تعذر تحميل ملف النشاط: '+r.error.message,
      true
    );

    return;
  }

  company=r.data?.[0]||null;
}

function navEvents(){

  document
    .querySelectorAll('[data-page]')
    .forEach(b=>{
      b.addEventListener(
        'click',
        ()=>{
          navigate(b.dataset.page);
        }
      );
    });

  $('menuBtn').onclick=()=>{
    $('layout').classList.toggle('menu-open');
  };

  $('langBtn').onclick=toggleLang;

  $('logoutBtn').onclick=async()=>{
    await db.auth.signOut();
    location.href='./';
  };
}

async function navigate(next){

  page=next;

  hideNotice();

  $('layout')
    .classList
    .remove('menu-open');

  document
    .querySelectorAll('.navbtn[data-page]')
    .forEach(b=>{
      b.classList.toggle(
        'active',
        b.dataset.page===next
      );
    });

  $('page').innerHTML=`
    <div class="card">
      <div class="skeleton" style="width:30%"></div>
      <br>
      <div class="skeleton" style="width:80%"></div>
      <br>
      <div class="skeleton" style="width:65%"></div>
    </div>
  `;

  await new Promise(
    r=>requestAnimationFrame(r)
  );

  if(next==='overview')
    await renderOverview();

  else if(next==='discover')
    await renderDiscover();

  else if(next==='products')
    await renderProducts();

  else if(next==='inbox')
    await renderInbox();

  else if(next==='company')
    renderCompany();

  else
    renderSettings();
}

function head(title,desc,action=''){

  return `
    <div class="pagehead">

      <div>

        <div class="eyebrow">
          WASLA WORKSPACE
        </div>

        <h1>${title}</h1>

        <p class="sub">
          ${desc}
        </p>

      </div>

      ${action}

    </div>
  `;
}

/* الواجهة الرئيسية */
async function renderOverview(){

  let pCount=0;
  let iCount=0;

  if(company){

    const [

      i

async function startInquiry(productId){

  const msg=prompt(
    t(
      'اكتب رسالتك للشركة:',
      'Write your message to the company:'
    )
  );

  if(!msg?.trim()) return;

  const {
    data:p,
    error
  }=await db
    .from('products')
    .select('company_id')
    .eq('id',productId)
    .single();

  if(error){

    notify(error.message,true);

    return;
  }

  const {error:e}=await db
    .from('inquiries')
    .insert({
      product_id:productId,
      company_id:p.company_id,
      buyer_id:user.id,
      message:msg.trim(),
      status:'pending'
    });

  if(e)

    notify(
      'تعذر إرسال الاستفسار: '+e.message,
      true
    );

  else

    notify(
      t(
        'تم إرسال الاستفسار. ستظهر المحادثة في صندوق الوارد.',
        'Inquiry sent. It will appear in your inbox.'
      )
    );
}

async function openInquiry(id){

  activeInquiry=id;

  const i=inquiries.find(
    x=>x.id===id
  );

  if(!i)return;

  document
    .querySelectorAll('[data-inquiry]')
    .forEach(b=>{
      b.classList.toggle(
        'selected',
        b.dataset.inquiry===id
      );
    });

  const companyName=
    rel(i.companies)?.name||
    t('الشركة','Company');

  const productName=
    rel(i.products)?.name||
    t('استفسار منتج','Product inquiry');

  $('thread').innerHTML=`

    <div class="threadhead">

      <span class="convavatar">
        ${esc(
          companyName.charAt(0)
        )}
      </span>

      <div>

        <strong>
          ${esc(companyName)}
        </strong>

        <div class="muted">
          ${esc(productName)}
          ·
          ${status(i.status)}
        </div>

      </div>

    </div>

    <div
      class="threadbody"
      id="threadBody"
    >

      <div
        class="bubble ${
          profile.account_type==='buyer'
          ?
          'mine'
          :
          ''
        }"
      >

        <p>
          ${esc(i.message||'')}
        </p>

        <time>
          ${date(i.created_at)}
          ·
          ${t(
            'رسالة الاستفسار',
            'Inquiry message'
          )}
        </time>

      </div>

      ${
        i.reply

        ?

        `
        <div
          class="bubble ${
            profile.account_type==='buyer'
            ?
            ''
            :
            'mine'
          }"
        >

          <p>
            ${esc(i.reply)}
          </p>

          <time>
            ${date(i.responded_at)}
            ·
            ${t(
              'رد الشركة',
              'Company reply'
            )}
          </time>

        </div>
        `

        :

        ''
      }

    </div>

    <div class="composer">

      <textarea
        class="field"
        id="replyText"
        placeholder="${t(
          'اكتب ردًا أو رسالة متابعة…',
          'Write a reply or follow-up…'
        )}"
        ${
          i.status==='closed'
          ?
          'disabled'
          :
          ''
        }
      ></textarea>

      <button
        class="btn"
        id="sendReply"
        ${
          i.status==='closed'
          ?
          'disabled'
          :
          ''
        }
      >
        ${
          i.reply
          ?
          t(
            'تحديث الرد',
            'Update reply'
          )
          :
          t(
            'إرسال الرد',
            'Send reply'
          )
        }
      </button>

    </div>
  `;

  $('sendReply').onclick=async()=>{

    const text=
      $('replyText')
      .value
      .trim();

    if(!text){

      notify(
        t(
          'اكتب الرسالة أولًا.',
          'Write a message first.'
        ),
        true
      );

      return;
    }

    if(profile.account_type==='buyer'){

      notify(
        t(
          'المتابعة النصية المستقلة تحتاج تفعيل جدول المحادثات الجديد. يمكنك متابعة الرد من هذا السجل.',
          'Independent buyer follow-ups require the new conversations schema. You can view company replies here.'
        ),
        true
      );

      return;
    }

    const {
      data,
      error
    }=await db
      .from('inquiries')
      .update({
        reply:text,
        status:'responded',
        responded_at:new Date().toISOString()
      })
      .eq('id',i.id)
      .eq('company_id',company.id)
      .select('id')
      .maybeSingle();

    if(error||!data){

      return notify(
        t(
          'تعذر إرسال الرد: ',
          'Could not send reply: '
        )
        +
        (
          error?.message||
          'permission denied'
        ),
        true
      );
    }

    notify(
      t(
        'تم حفظ الرد بنجاح.',
        'Reply saved.'
      )
    );

    await renderInbox();
  };
}

          )}
        </h2>

        <p class="muted">
          ${esc(
            profile.full_name||
            user.email
          )}
        </p>

        <p class="muted">
          ${t(
            'يمكنك استكشاف السوق وإرسال استفسارات للشركات من حسابك.',
            'You can explore the market and send inquiries to businesses.'
          )}
        </p>

      </div>
      `

      :

      !company

      ?

      `
      <div class="card">

        <p class="muted">
          ${t(
            'لا يوجد ملف نشاط بعد.',
            'No business profile yet.'
          )}
        </p>

        ${companyForm()}

      </div>
      `

      :

      `
      <div class="card">

        <div class="row">

          <div>

            <h2 class="sectiontitle">
              ${esc(company.name)}
            </h2>

            <span class="tag">
              ${status(company.status)}
            </span>

          </div>

        </div>

        ${companyForm(company)}

      </div>
      `
    );

  const f=$('companyForm');

  if(f)

    f.onsubmit=async e=>{

      e.preventDefault();

      const d=
        Object.fromEntries(
          new FormData(f)
        );

      let r=
        company

        ?

        await db
          .from('companies')
          .update(d)
          .eq('id',company.id)
          .eq('owner_id',user.id)
          .select()
          .single()

        :

        await db
          .from('companies')
          .insert({
            ...d,
            owner_id:user.id
          })
          .select()
          .single();

      if(r.error)

        return notify(
          r.error.message,
          true
        );

      company=r.data;

      notify(
        t(
          'تم حفظ ملف النشاط.',
          'Business profile saved.'
        )
      );

      renderCompany();
    };
}

function companyForm(c={}){

  const fields=[
    ['name','اسم النشاط / Business name'],
    ['country','الدولة / Country'],
    ['city','المدينة / City'],
    ['sector','القطاع / Sector'],
    ['business_type','نوع النشاط / Business type'],
    ['email','البريد الإلكتروني / Email'],
    ['phone','الهاتف / Phone'],
    ['website','الموقع / Website']
  ];

  return `

    <form
      id="companyForm"
      class="formgrid"
    >

      ${
        fields.map(
          ([k,l])=>`

            <label>

              ${l}

              <input
                class="field"
                name="${k}"
                value="${esc(c[k]||'')}"
                ${
                  ['name','country']
                    .includes(k)
                  ?
                  'required'
                  :
                  ''
                }
              >

            </label>

          `
        ).join('')
      }

      <label class="full">

        ${t(
          'نبذة عن النشاط',
          'Business description'
        )}

        <textarea
          class="field"
          name="description"
        >${esc(c.description||'')}</textarea>

      </label>

      <div class="full">

        <button class="btn">

          ${t(
            'حفظ التغييرات',
            'Save changes'
          )}

        </button>

      </div>

    </form>

  `;
}

function renderSettings(){

  $('page').innerHTML=
    head(
      t(
        'الإعدادات',
        'Settings'
      ),
      t(
        'تفضيلات مساحة العمل.',
        'Workspace preferences.'
      )
    )
    +

    `
    <div class="card">

      <h2 class="sectiontitle">
        ${t(
          'اللغة',
          'Language'
        )}
      </h2>

      <p class="muted">
        ${t(
          'يمكنك التبديل بين العربية والإنجليزية من الشريط العلوي.',
          'Switch between Arabic and English from the top bar.'
        )}
      </p>

      <button
        class="btn secondary"
        onclick="toggleLang()"
      >
        ${t(
          'تغيير اللغة',
          'Change language'
        )}
      </button>

      <hr
        style="
          border:0;
          border-top:1px solid var(--line);
          margin:22px 0
        "
      >

      <h2 class="sectiontitle">
        ${t(
          'الحساب',
          'Account'
        )}
      </h2>

      <p class="muted">
        ${esc(user.email||'')}
        ·
        ${typeName(profile.account_type)}
      </p>

      <button
        class="btn danger"
        onclick="document.getElementById('logoutBtn').click()"
      >
        ${t(
          'تسجيل الخروج',
          'Sign out'
        )}
      </button>

    </div>
    `;
}

function toggleLang(){

  lang=
    lang==='ar'
    ?
    'en'
    :
    'ar';

  document.documentElement.lang=lang;

  document.documentElement.dir=
    lang==='ar'
    ?
    'rtl'
    :
    'ltr';

  $('langBtn').textContent=
    lang==='ar'
    ?
    'English'
    :
    'العربية';

  navigate(page);
}

navEvents();
boot();

</script>

</body>
</html>
